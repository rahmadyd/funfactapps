<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Four-leaf clover icon -->
  <defs>
    <linearGradient id="clover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Top leaf -->
  <ellipse cx="32" cy="18" rx="10" ry="13" fill="url(#clover)" transform="rotate(0 32 32)"/>
  <!-- Bottom leaf -->
  <ellipse cx="32" cy="46" rx="10" ry="13" fill="url(#clover)" transform="rotate(0 32 32)"/>
  <!-- Left leaf -->
  <ellipse cx="18" cy="32" rx="13" ry="10" fill="url(#clover)" transform="rotate(0 32 32)"/>
  <!-- Right leaf -->
  <ellipse cx="46" cy="32" rx="13" ry="10" fill="url(#clover)" transform="rotate(0 32 32)"/>
  <!-- Center circle -->
  <circle cx="32" cy="32" r="5" fill="#15803d"/>
  <!-- Stem -->
  <path d="M32 37 Q34 50 36 58" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
